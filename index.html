<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07101e">
  <meta name="description" content="EKAAZEN LLP — One Source. Endless Creations. Official website coming soon.">
  <title>EKAAZEN LLP | Coming Soon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #07101e;
      color: #f4e5bc;
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(100%, 1000px); text-align: center; }
    img {
      display: block;
      width: min(100%, 760px);
      height: auto;
      margin: 0 auto;
      border-radius: 4px;
    }
    .coming {
      margin: 20px 0 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(12px, 2vw, 16px);
      letter-spacing: .28em;
      text-transform: uppercase;
      color: #d9b86d;
    }
    footer {
      margin-top: 18px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #c8cbd2;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="EKAAZEN — One Source. Endless Creations.">
    <p class="coming">Official website coming soon</p>
    <footer>EKAAZEN LLP</footer>
  </main>
</body>
</html>
